<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Tic Tac Toe</title>
    <style>
      * { box-sizing: border-box; }
      html, body { margin: 0; height: 100%; }
      body {
        font-family: system-ui, sans-serif;
        background: linear-gradient(#ffe3b0, #f0b45a);
        color: #5a3b12;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 16px;
        padding: 16px;
      }
      h1 { margin: 0; font-size: 1.6rem; }
      .board {
        width: min(420px, 92vw);
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 10px;
      }
      .cell {
        aspect-ratio: 1;
        border: 0;
        border-radius: 18px;
        background: #fff8ec;
        font-size: clamp(2.4rem, 10vw, 4rem);
        font-weight: 800;
        cursor: pointer;
        box-shadow: 0 8px 0 rgba(120, 70, 10, 0.15);
      }
      .cell.x { color: #e85d4c; }
      .cell.o { color: #2f6bff; }
      .cell.win { background: #d8ffb0; }
      .cell:disabled { cursor: default; }
      .again {
        border: 0;
        background: #5a3b12;
        color: #fff;
        font: inherit;
        font-weight: 800;
        border-radius: 999px;
        padding: 10px 18px;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <h1 id="status">X goes first</h1>
    <div class="board" id="board"></div>
    <button class="again" id="again" type="button" hidden>Play again</button>
    <script>
      const lines = [
        [0, 1, 2], [3, 4, 5], [6, 7, 8],
        [0, 3, 6], [1, 4, 7], [2, 5, 8],
        [0, 4, 8], [2, 4, 6],
      ];
      const board = document.getElementById("board");
      const status = document.getElementById("status");
      const again = document.getElementById("again");
      let cells = [];
      let turn = "X";
      let done = false;

      again.addEventListener("click", setup);
      setup();

      function setup() {
        turn = "X";
        done = false;
        cells = Array(9).fill("");
        status.textContent = "X goes first";
        again.hidden = true;
        board.replaceChildren();
        for (let i = 0; i < 9; i += 1) {
          const button = document.createElement("button");
          button.type = "button";
          button.className = "cell";
          button.setAttribute("aria-label", `Square ${i + 1}`);
          button.addEventListener("click", () => play(i, button));
          board.appendChild(button);
        }
      }

      function play(index, button) {
        if (done || cells[index]) return;
        cells[index] = turn;
        button.textContent = turn;
        button.classList.add(turn.toLowerCase());
        button.disabled = true;
        const win = lines.find((line) => line.every((i) => cells[i] === turn));
        if (win) {
          done = true;
          status.textContent = `${turn} wins`;
          again.hidden = false;
          [...board.children].forEach((cell, i) => {
            if (win.includes(i)) cell.classList.add("win");
            cell.disabled = true;
          });
          return;
        }
        if (cells.every(Boolean)) {
          done = true;
          status.textContent = "It's a draw";
          again.hidden = false;
          return;
        }
        turn = turn === "X" ? "O" : "X";
        status.textContent = `${turn}'s turn`;
      }
    </script>
  </body>
</html>
