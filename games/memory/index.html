<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Memory Match</title>
    <style>
      * { box-sizing: border-box; }
      html, body { margin: 0; height: 100%; }
      body {
        font-family: system-ui, sans-serif;
        background: linear-gradient(#c9b6ff, #7a5af5);
        color: #2a1860;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 14px;
        padding: 16px;
      }
      .hud { font-weight: 800; font-size: 1.15rem; color: #fff; }
      .grid {
        width: min(440px, 100%);
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 10px;
      }
      .card {
        aspect-ratio: 3 / 4;
        border: 0;
        padding: 0;
        background: transparent;
        cursor: pointer;
        perspective: 600px;
      }
      .card__inner {
        width: 100%;
        height: 100%;
        position: relative;
        transform-style: preserve-3d;
        transition: transform 0.35s ease;
      }
      .card.is-up .card__inner, .card.is-matched .card__inner { transform: rotateY(180deg); }
      .face {
        position: absolute;
        inset: 0;
        border-radius: 14px;
        backface-visibility: hidden;
        display: grid;
        place-items: center;
        font-size: clamp(1.6rem, 6vw, 2.2rem);
        box-shadow: 0 8px 0 rgba(50, 20, 90, 0.18);
      }
      .face--back {
        background:
          radial-gradient(circle at 30% 28%, #efe7ff 0 16%, transparent 17%),
          repeating-linear-gradient(45deg, #fff, #fff 7px, #f4ecff 7px 14px);
      }
      .face--front { background: #ffe56a; transform: rotateY(180deg); }
      .card.is-matched { cursor: default; }
      .card.is-matched .face--front { background: #d8ffb0; }
      .win {
        position: fixed;
        inset: 0;
        display: grid;
        place-items: center;
        background: rgba(40, 20, 80, 0.35);
      }
      .win[hidden] { display: none; }
      .card-panel {
        background: #fff;
        border-radius: 24px;
        padding: 24px 28px;
        text-align: center;
      }
      h1 { margin: 0 0 8px; }
      button.again {
        border: 0;
        background: #6c4ad4;
        color: #fff;
        font: inherit;
        font-weight: 800;
        border-radius: 999px;
        padding: 10px 18px;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <div class="hud" id="hud">Moves 0</div>
    <div class="grid" id="grid"></div>
    <div class="win" id="win" hidden>
      <div class="card-panel">
        <h1>Nice match!</h1>
        <p id="win-text"></p>
        <button class="again" id="again" type="button">Play again</button>
      </div>
    </div>
    <script>
      const faces = ["♪", "★", "☾", "🌈", "🎈", "🍓", "🐟", "🌸"];
      const grid = document.getElementById("grid");
      const hud = document.getElementById("hud");
      const win = document.getElementById("win");
      const winText = document.getElementById("win-text");
      let deck = [];
      let open = [];
      let lock = false;
      let moves = 0;
      let matched = 0;

      document.getElementById("again").addEventListener("click", deal);
      deal();

      function deal() {
        moves = 0;
        matched = 0;
        open = [];
        lock = false;
        win.hidden = true;
        hud.textContent = "Moves 0";
        deck = shuffle([...faces, ...faces]).map((symbol, index) => ({ id: index, symbol }));
        grid.replaceChildren();
        for (const card of deck) {
          const button = document.createElement("button");
          button.type = "button";
          button.className = "card";
          button.dataset.id = String(card.id);
          button.setAttribute("aria-label", "Hidden card");
          button.innerHTML = `<span class="card__inner"><span class="face face--back"></span><span class="face face--front">${card.symbol}</span></span>`;
          button.addEventListener("click", () => flip(button, card));
          grid.appendChild(button);
        }
      }

      function flip(button, card) {
        if (lock || button.classList.contains("is-up") || button.classList.contains("is-matched")) return;
        button.classList.add("is-up");
        button.setAttribute("aria-label", card.symbol);
        open.push({ button, card });
        if (open.length < 2) return;
        moves += 1;
        hud.textContent = `Moves ${moves}`;
        const [a, b] = open;
        open = [];
        if (a.card.symbol === b.card.symbol) {
          a.button.classList.add("is-matched");
          b.button.classList.add("is-matched");
          matched += 1;
          if (matched === faces.length) {
            winText.textContent = `You cleared the board in ${moves} moves.`;
            win.hidden = false;
          }
          return;
        }
        lock = true;
        setTimeout(() => {
          a.button.classList.remove("is-up");
          b.button.classList.remove("is-up");
          a.button.setAttribute("aria-label", "Hidden card");
          b.button.setAttribute("aria-label", "Hidden card");
          lock = false;
        }, 700);
      }

      function shuffle(list) {
        for (let i = list.length - 1; i > 0; i -= 1) {
          const j = Math.floor(Math.random() * (i + 1));
          [list[i], list[j]] = [list[j], list[i]];
        }
        return list;
      }
    </script>
  </body>
</html>
