<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Mirror Draw</title>
    <style>
      * { box-sizing: border-box; }
      html, body { margin: 0; height: 100%; }
      body {
        font-family: system-ui, sans-serif;
        background: linear-gradient(#e8fff4, #dce8ff);
        display: flex;
        flex-direction: column;
        height: 100%;
        color: #1c2a40;
      }
      .bar {
        display: flex; flex-wrap: wrap; gap: 8px; align-items: center; padding: 10px;
      }
      .swatch, .wide {
        border: 3px solid transparent; border-radius: 999px; cursor: pointer;
        background: #fff; font: inherit; font-weight: 800;
      }
      .swatch { width: 34px; height: 34px; border-radius: 50%; }
      .swatch.is-on, .wide.is-on { border-color: #1c2a40; }
      .wide { padding: 8px 12px; box-shadow: 0 2px 0 rgba(0,0,0,.06); }
      .stage { flex: 1; position: relative; min-height: 0; }
      canvas { width: 100%; height: 100%; touch-action: none; background: #fff; display: block; cursor: crosshair; }
      .hint {
        position: absolute; top: 10px; left: 50%; transform: translateX(-50%);
        background: rgba(255,255,255,.85); padding: 6px 12px; border-radius: 999px;
        font-weight: 800; font-size: 0.9rem; pointer-events: none;
      }
    </style>
  </head>
  <body>
    <div class="bar" id="bar">
      <button class="wide" id="clear" type="button">Clear</button>
    </div>
    <div class="stage">
      <canvas id="paper"></canvas>
      <div class="hint">Draw on one side — the other mirrors</div>
    </div>
    <script>
      const colors = ["#e85d4c", "#f0a202", "#6ab04c", "#2f6bff", "#b83fce", "#1c2a40"];
      const bar = document.getElementById("bar");
      const canvas = document.getElementById("paper");
      const ctx = canvas.getContext("2d");
      let color = colors[0];
      let size = 8;
      let drawing = false;

      colors.forEach((c, i) => {
        const btn = document.createElement("button");
        btn.type = "button";
        btn.className = "swatch" + (i === 0 ? " is-on" : "");
        btn.style.background = c;
        btn.addEventListener("click", () => {
          color = c;
          bar.querySelectorAll(".swatch").forEach((el) => el.classList.remove("is-on"));
          btn.classList.add("is-on");
        });
        bar.appendChild(btn);
      });

      [5, 10, 18].forEach((px, i) => {
        const btn = document.createElement("button");
        btn.type = "button";
        btn.className = "wide" + (i === 1 ? " is-on" : "");
        btn.textContent = i === 0 ? "Thin" : i === 1 ? "Med" : "Thick";
        btn.addEventListener("click", () => {
          size = px;
          bar.querySelectorAll(".wide").forEach((el) => {
            if (el.id !== "clear") el.classList.remove("is-on");
          });
          btn.classList.add("is-on");
        });
        bar.appendChild(btn);
      });

      function resize() {
        const rect = canvas.getBoundingClientRect();
        const img = ctx.getImageData(0, 0, canvas.width || 1, canvas.height || 1);
        canvas.width = rect.width * devicePixelRatio;
        canvas.height = rect.height * devicePixelRatio;
        ctx.setTransform(devicePixelRatio, 0, 0, devicePixelRatio, 0, 0);
        drawGuide();
      }

      function drawGuide() {
        const w = canvas.clientWidth;
        const h = canvas.clientHeight;
        ctx.save();
        ctx.strokeStyle = "rgba(60,80,120,.25)";
        ctx.setLineDash([6, 8]);
        ctx.beginPath();
        ctx.moveTo(w / 2, 0);
        ctx.lineTo(w / 2, h);
        ctx.stroke();
        ctx.restore();
      }

      function pos(e) {
        const rect = canvas.getBoundingClientRect();
        const p = e.touches ? e.touches[0] : e;
        return { x: p.clientX - rect.left, y: p.clientY - rect.top };
      }

      function strokeAt(x, y, prev) {
        const w = canvas.clientWidth;
        ctx.lineCap = "round";
        ctx.lineJoin = "round";
        ctx.strokeStyle = color;
        ctx.lineWidth = size;
        [[x, prev.x], [w - x, w - prev.x]].forEach(([cx, px]) => {
          ctx.beginPath();
          ctx.moveTo(px, prev.y);
          ctx.lineTo(cx, y);
          ctx.stroke();
        });
      }

      let prev = null;
      function down(e) {
        e.preventDefault();
        drawing = true;
        prev = pos(e);
      }
      function move(e) {
        if (!drawing) return;
        e.preventDefault();
        const cur = pos(e);
        strokeAt(cur.x, cur.y, prev);
        prev = cur;
      }
      function up() { drawing = false; prev = null; }

      canvas.addEventListener("pointerdown", down);
      canvas.addEventListener("pointermove", move);
      window.addEventListener("pointerup", up);
      document.getElementById("clear").addEventListener("click", () => {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        drawGuide();
      });
      window.addEventListener("resize", resize);
      resize();
    </script>
  </body>
</html>
