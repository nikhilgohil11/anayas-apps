<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Whack</title>
    <style>
      * { box-sizing: border-box; }
      html, body { margin: 0; height: 100%; }
      body {
        font-family: system-ui, sans-serif;
        background: linear-gradient(#8fd18a, #3f8f4e);
        color: #143516;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 14px;
        padding: 16px;
        user-select: none;
      }
      .hud { font-weight: 800; font-size: 1.3rem; color: #fff; }
      .grid { width: min(420px, 100%); display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
      .hole {
        aspect-ratio: 1;
        border: 0;
        border-radius: 50%;
        background: #245c30;
        box-shadow: inset 0 10px 0 rgba(0, 0, 0, 0.18);
        cursor: pointer;
        font-size: 2.4rem;
      }
      .hole.up { background: #1d4a28; }
      .over { position: fixed; inset: 0; display: grid; place-items: center; background: rgba(20, 50, 20, 0.35); }
      .over[hidden] { display: none; }
      .card { background: #fff; border-radius: 24px; padding: 24px; text-align: center; }
      h1 { margin: 0 0 8px; }
      button.play { border: 0; background: #245c30; color: #fff; font: inherit; font-weight: 800; border-radius: 999px; padding: 12px 18px; cursor: pointer; }
    </style>
  </head>
  <body>
    <div class="hud"><span id="score">0</span> · <span id="time">0:20</span></div>
    <div class="grid" id="grid"></div>
    <div class="over" id="over">
      <div class="card">
        <h1>Whack</h1>
        <p id="blurb">Tap the faces before they hide.</p>
        <button class="play" id="play" type="button">Play</button>
      </div>
    </div>
    <script>
      const grid = document.getElementById("grid");
      const scoreEl = document.getElementById("score");
      const timeEl = document.getElementById("time");
      const over = document.getElementById("over");
      const holes = [];
      let score = 0;
      let left = 20;
      let up = -1;
      let timers = [];
      let best = Number(localStorage.getItem("anaya-whack") || 0);

      for (let i = 0; i < 9; i += 1) {
        const button = document.createElement("button");
        button.type = "button";
        button.className = "hole";
        button.setAttribute("aria-label", "Hole");
        button.addEventListener("pointerdown", (event) => {
          event.preventDefault();
          if (i !== up) return;
          score += 1;
          scoreEl.textContent = String(score);
          hide();
        });
        grid.appendChild(button);
        holes.push(button);
      }

      document.getElementById("play").addEventListener("click", start);

      function start() {
        score = 0;
        left = 20;
        scoreEl.textContent = "0";
        timeEl.textContent = "0:20";
        over.hidden = true;
        timers.forEach(clearInterval);
        timers = [
          setInterval(pop, 700),
          setInterval(() => {
            left -= 1;
            timeEl.textContent = `0:${String(Math.max(left, 0)).padStart(2, "0")}`;
            if (left <= 0) finish();
          }, 1000),
        ];
        pop();
      }

      function hide() {
        if (up >= 0) {
          holes[up].textContent = "";
          holes[up].classList.remove("up");
        }
        up = -1;
      }

      function pop() {
        hide();
        up = Math.floor(Math.random() * 9);
        holes[up].textContent = "◕";
        holes[up].classList.add("up");
      }

      function finish() {
        timers.forEach(clearInterval);
        timers = [];
        hide();
        best = Math.max(best, score);
        localStorage.setItem("anaya-whack", String(best));
        document.getElementById("blurb").textContent = `You tapped ${score}. Best is ${best}.`;
        document.getElementById("play").textContent = "Play again";
        over.hidden = false;
      }
    </script>
  </body>
</html>
