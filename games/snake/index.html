<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Snake</title>
    <style>
      * { box-sizing: border-box; }
      html, body { margin: 0; height: 100%; }
      body {
        font-family: system-ui, sans-serif;
        background: #145c28;
        color: #f3ffe8;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 8px;
        padding: 12px;
        overflow: hidden;
      }
      .hud { font-weight: 800; }
      canvas { width: min(92vw, 70vh); height: min(92vw, 70vh); background: #1f7a32; border-radius: 18px; touch-action: none; }
      .over {
        position: absolute;
        inset: 0;
        display: grid;
        place-items: center;
        background: rgba(8, 40, 16, 0.45);
      }
      .over[hidden] { display: none; }
      .card { background: #f3ffe8; color: #145c28; border-radius: 20px; padding: 20px 24px; text-align: center; }
      button { border: 0; background: #145c28; color: #fff; font: inherit; font-weight: 800; border-radius: 999px; padding: 10px 16px; cursor: pointer; }
    </style>
  </head>
  <body>
    <div class="hud" id="hud">Score 0 · swipe or arrows</div>
    <canvas id="board" width="400" height="400"></canvas>
    <div class="over" id="over" hidden>
      <div class="card">
        <h1 id="over-title">Game over</h1>
        <p id="over-text"></p>
        <button id="again" type="button">Play again</button>
      </div>
    </div>
    <script>
      const canvas = document.getElementById("board");
      const ctx = canvas.getContext("2d");
      const hud = document.getElementById("hud");
      const over = document.getElementById("over");
      const overText = document.getElementById("over-text");
      const COLS = 20;
      let snake, dir, next, food, score, timer, alive, started;
      let best = Number(localStorage.getItem("anaya-snake") || 0);
      let pointer = null;

      document.getElementById("again").addEventListener("click", reset);
      window.addEventListener("keydown", (event) => {
        const map = {
          ArrowUp: [0, -1], ArrowDown: [0, 1], ArrowLeft: [-1, 0], ArrowRight: [1, 0],
          KeyW: [0, -1], KeyS: [0, 1], KeyA: [-1, 0], KeyD: [1, 0],
        };
        const turn = map[event.code];
        if (!turn) return;
        event.preventDefault();
        setDir(turn[0], turn[1]);
        started = true;
      });
      canvas.addEventListener("pointerdown", (event) => {
        pointer = { x: event.clientX, y: event.clientY };
      });
      canvas.addEventListener("pointerup", (event) => {
        if (!pointer) return;
        const dx = event.clientX - pointer.x;
        const dy = event.clientY - pointer.y;
        if (Math.hypot(dx, dy) < 16) return;
        if (Math.abs(dx) > Math.abs(dy)) setDir(dx > 0 ? 1 : -1, 0);
        else setDir(0, dy > 0 ? 1 : -1);
        started = true;
      });

      reset();

      function reset() {
        snake = [{ x: 8, y: 10 }, { x: 7, y: 10 }, { x: 6, y: 10 }];
        dir = { x: 1, y: 0 };
        next = { x: 1, y: 0 };
        score = 0;
        alive = true;
        started = false;
        over.hidden = true;
        placeFood();
        hud.textContent = `Score 0 · best ${best}`;
        clearInterval(timer);
        timer = setInterval(tick, 140);
        draw();
      }

      function setDir(x, y) {
        if ((dir.x + x === 0 && dir.y + y === 0) || (next.x + x === 0 && next.y + y === 0)) return;
        next = { x, y };
      }

      function tick() {
        if (!alive || !started) return;
        dir = next;
        const head = { x: snake[0].x + dir.x, y: snake[0].y + dir.y };
        if (head.x < 0 || head.y < 0 || head.x >= COLS || head.y >= COLS || snake.some((part) => part.x === head.x && part.y === head.y)) {
          alive = false;
          clearInterval(timer);
          best = Math.max(best, score);
          localStorage.setItem("anaya-snake", String(best));
          overText.textContent = `Score ${score}. Best ${best}.`;
          over.hidden = false;
          return;
        }
        snake.unshift(head);
        if (head.x === food.x && head.y === food.y) {
          score += 1;
          hud.textContent = `Score ${score} · best ${best}`;
          placeFood();
        } else {
          snake.pop();
        }
        draw();
      }

      function placeFood() {
        do {
          food = { x: Math.floor(Math.random() * COLS), y: Math.floor(Math.random() * COLS) };
        } while (snake.some((part) => part.x === food.x && part.y === food.y));
      }

      function draw() {
        const size = canvas.width / COLS;
        ctx.fillStyle = "#1f7a32";
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = "#ff5d73";
        roundRect(food.x * size + 3, food.y * size + 3, size - 6, size - 6, 6);
        snake.forEach((part, index) => {
          ctx.fillStyle = index === 0 ? "#f4ffd8" : "#d8ff9a";
          roundRect(part.x * size + 2, part.y * size + 2, size - 4, size - 4, 6);
        });
      }

      function roundRect(x, y, w, h, r) {
        ctx.beginPath();
        ctx.roundRect(x, y, w, h, r);
        ctx.fill();
      }
    </script>
  </body>
</html>
