<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Note Catch</title>
    <style>
      * { box-sizing: border-box; }
      html, body { margin: 0; height: 100%; }
      body { background: #8ecae6; overflow: hidden; font-family: system-ui, sans-serif; }
      canvas { width: 100%; height: 100%; display: block; touch-action: none; }
      .over {
        position: absolute;
        inset: 0;
        display: grid;
        place-items: center;
        background: rgba(20, 50, 70, 0.35);
      }
      .over[hidden] { display: none; }
      .card { background: #fff; color: #24556e; border-radius: 24px; padding: 24px; text-align: center; }
      h1 { margin: 0 0 8px; }
      button { border: 0; background: #24556e; color: #fff; font: inherit; font-weight: 800; border-radius: 999px; padding: 10px 18px; cursor: pointer; }
    </style>
  </head>
  <body>
    <canvas id="game"></canvas>
    <div class="over" id="over">
      <div class="card">
        <h1>Note Catch</h1>
        <p id="blurb">Catch the falling notes. Three misses and the song stops.</p>
        <button id="play" type="button">Play</button>
      </div>
    </div>
    <script>
      const canvas = document.getElementById("game");
      const ctx = canvas.getContext("2d");
      const over = document.getElementById("over");
      const blurb = document.getElementById("blurb");
      const colors = ["#e85d4c", "#f0a202", "#7ed957", "#2ec4b6", "#6c63ff"];
      const names = ["Do", "Re", "Mi", "Fa", "Sol"];
      let notes = [];
      let basket = 0;
      let score = 0;
      let lives = 3;
      let running = false;
      let last = 0;
      let spawn = 0;
      let best = Number(localStorage.getItem("anaya-catch") || 0);

      document.getElementById("play").addEventListener("click", start);
      canvas.addEventListener("pointermove", (event) => {
        const rect = canvas.getBoundingClientRect();
        basket = ((event.clientX - rect.left) / rect.width) * canvas.width;
      });
      canvas.addEventListener("pointerdown", (event) => {
        const rect = canvas.getBoundingClientRect();
        basket = ((event.clientX - rect.left) / rect.width) * canvas.width;
      });
      window.addEventListener("resize", fit);
      fit();

      function fit() {
        canvas.width = canvas.clientWidth * devicePixelRatio;
        canvas.height = canvas.clientHeight * devicePixelRatio;
        basket = canvas.width / 2;
      }

      function start() {
        fit();
        notes = [];
        score = 0;
        lives = 3;
        spawn = 0;
        running = true;
        over.hidden = true;
        last = performance.now();
        requestAnimationFrame(frame);
      }

      function frame(now) {
        if (!running) return;
        const dt = Math.min(32, now - last);
        last = now;
        spawn += dt;
        if (spawn > Math.max(380, 900 - score * 20)) {
          spawn = 0;
          const kind = Math.floor(Math.random() * names.length);
          notes.push({
            x: 40 + Math.random() * (canvas.width - 80),
            y: -20,
            r: 18 * devicePixelRatio,
            vy: (0.28 + Math.random() * 0.16 + score * 0.008) * devicePixelRatio,
            kind,
          });
        }
        const width = 92 * devicePixelRatio;
        const top = canvas.height - 48 * devicePixelRatio;
        notes.forEach((note) => { note.y += note.vy * dt; });
        notes = notes.filter((note) => {
          const caught = note.y > top && Math.abs(note.x - basket) < width / 2 + note.r;
          if (caught) {
            score += 1;
            return false;
          }
          if (note.y > canvas.height + note.r) {
            lives -= 1;
            return false;
          }
          return true;
        });
        lives = Math.max(0, lives);
        draw(width, top);
        if (lives <= 0) {
          running = false;
          best = Math.max(best, score);
          localStorage.setItem("anaya-catch", String(best));
          blurb.textContent = `You caught ${score}. Best is ${best}.`;
          document.getElementById("play").textContent = "Play again";
          over.hidden = false;
          return;
        }
        requestAnimationFrame(frame);
      }

      function draw(width, top) {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        const sky = ctx.createLinearGradient(0, 0, 0, canvas.height);
        sky.addColorStop(0, "#8ecae6");
        sky.addColorStop(1, "#ffd166");
        ctx.fillStyle = sky;
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = "#24556e";
        ctx.font = `800 ${22 * devicePixelRatio}px system-ui, sans-serif`;
        ctx.fillText(`Score ${score}`, 16 * devicePixelRatio, 36 * devicePixelRatio);
        ctx.fillText("♥".repeat(lives), 16 * devicePixelRatio, 68 * devicePixelRatio);
        for (const note of notes) {
          ctx.beginPath();
          ctx.fillStyle = colors[note.kind];
          ctx.arc(note.x, note.y, note.r, 0, Math.PI * 2);
          ctx.fill();
          ctx.fillStyle = "#fff";
          ctx.font = `800 ${12 * devicePixelRatio}px system-ui, sans-serif`;
          ctx.textAlign = "center";
          ctx.fillText(names[note.kind], note.x, note.y + 4 * devicePixelRatio);
          ctx.textAlign = "left";
        }
        ctx.fillStyle = "#c47b2b";
        ctx.beginPath();
        ctx.moveTo(basket - width / 2, top);
        ctx.quadraticCurveTo(basket, top + 46 * devicePixelRatio, basket + width / 2, top);
        ctx.lineTo(basket + width / 2, top + 18 * devicePixelRatio);
        ctx.lineTo(basket - width / 2, top + 18 * devicePixelRatio);
        ctx.closePath();
        ctx.fill();
      }
    </script>
  </body>
</html>
